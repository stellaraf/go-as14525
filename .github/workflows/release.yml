name: release

on:
    push:
        tags:
            - "*"

jobs:
    goreleaser:
        runs-on: ubuntu-latest
        env:
          GOPATH: /tmp/stellar-go
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: 1.21.x

            - name: Run GoReleaser
              uses: goreleaser/goreleaser-action@v5
              with:
                  version: latest
                  args: release --clean
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Store build artifacts (30 days)
              uses: actions/upload-artifact@v4
              with:
                name: dist-${{ github.run_attempt }}
                path: dist/
                retention-days: 30
                if-no-files-found: error
