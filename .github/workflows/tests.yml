name: Tests
on: [push, pull_request]

jobs:
    tests:
        name: Tests
        runs-on: codebuild-stellaraf-actions-public-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          GOPATH: /tmp/stellar-go
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: ">=1.21.0"
            - run: go test
